<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jirai Kei CSS：本批视觉预览</title>
  <style>
    :root { color-scheme: light; font: 16px/1.65 system-ui, sans-serif; color: #171717; background: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; }
    main { width: min(760px, calc(100% - 32px)); margin: 36px auto; }
    h1 { margin: 0 0 20px; font-size: 1.5rem; line-height: 1.25; }
    h2 { margin: 26px 0 8px; font-size: 1rem; }
    p { margin: 8px 0; }
    .plain { padding: 16px; border: 1px solid #d4d4d4; background: #fff; }
    .empty { margin-top: 10px; padding: 18px; border: 1px dashed #a3a3a3; color: #525252; background: #fff; }
    code { padding: 1px 4px; background: #f5f5f5; font: .9em ui-monospace, monospace; }
    a { color: #1d4ed8; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 3px; }
    @media (max-width: 520px) { main { width: calc(100% - 24px); margin: 18px auto; } }
  </style>
</head>
<body>
  <main>
    <h1>本批视觉预览</h1>
    <section class="plain">
      <h2>本批修改</h2>
      <p>只在全局 <code>:root</code> 变量区添加了分组注释。没有修改选择器、CSS 属性或属性值。</p>

      <h2>元素样式</h2>
      <div class="empty">本批没有任何元素样式发生变化，所以这里不伪造控件预览。</div>

      <h2>后续预览方式</h2>
      <p>下一批组件获得确认并完成后，我会只展示该批实际涉及的元素：从冻结页面提取并去敏实际 DOM 结构，在隔离的白底预览区直接加载完整主题 CSS。未涉及的页面区域保持白色。</p>
      <p><a href="../../runtime/preview-package/jirai-kei-theme/theme.css">查看当前完整主题 CSS</a></p>
    </section>
  </main>
</body>
</html>
