<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#16112a;color:#f2ebff;font:13px system-ui}.vrcx-0-main-content{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel,.vrcx-0-page-scaffold{padding:12px;border:1px solid #6c5ce0;background:#201936}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}[data-slot=button][data-variant]{height:32px;padding:4px 10px;border:1px solid #777;border-radius:2px}[data-slot=button][data-variant=ghost]{background:transparent}[data-slot=badge]{display:inline-flex;align-items:center;height:20px;padding:2px 8px;border:1px solid transparent;border-radius:999px}.tabs-list{display:flex;width:max-content;gap:2px;padding:2px;border-radius:8px;background:#333}.tabs-list>[data-slot=tabs-tab]{height:30px;padding:4px 10px;border:1px solid transparent;border-radius:8px}a[data-slot=pagination-link]{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border:1px solid transparent}.pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid #777;border-radius:999px;background:#30253d;box-shadow:0 4px 12px #0008}.pill-shell{display:flex;justify-content:center}.alert{border:1px solid #777;border-radius:8px;padding:8px 10px}.tab-indicator{position:absolute}.float{border-radius:999px;background:#30253d;backdrop-filter:blur(2px)}
</style></head><body><header class="vrcx-0-titlebar"><span data-slot="badge" data-variant="default" id="title-badge">3</span></header><main class="vrcx-0-main-content">
<section class="panel" id="general"><h3>按钮 variants</h3><div class="row"><button data-slot="button" data-variant="default">Primary</button><button data-slot="button" data-variant="outline">Outline</button><button data-slot="button" data-variant="secondary">Secondary</button><button data-slot="button" data-variant="ghost">Ghost</button><button data-slot="button" data-variant="destructive">Delete</button><a href="#" data-slot="button" data-variant="link">Link</a></div><div class="row"><button data-slot="button" data-variant="default" disabled>Disabled</button></div></section>
<section class="panel" id="badges"><h3>Badges · 语义色</h3><div class="row"><span data-slot="badge" data-variant="default">Default</span><span data-slot="badge" data-variant="secondary">Secondary</span><span data-slot="badge" data-variant="destructive">Destructive</span><span data-slot="badge" data-variant="outline">Outline</span><span data-slot="badge" data-variant="ghost">Ghost</span><span data-slot="badge" data-variant="link">Link</span></div></section>
<section class="panel" id="misc"><h3>分页 / Alert / 分隔线</h3><nav data-slot="pagination-content" class="row"><a data-slot="pagination-link" href="#">1</a><a data-slot="pagination-link" data-active="true" aria-current="page" href="#">2</a><a data-slot="pagination-link" aria-disabled="true" href="#">3</a></nav><div data-slot="alert" role="alert" class="alert"><strong data-slot="alert-title">Notice</strong><span data-slot="alert-description">示例提示文本</span></div><div data-slot="alert" role="alert" class="alert text-destructive"><strong data-slot="alert-title">Error</strong><span data-slot="alert-description">示例错误信息</span></div><div data-slot="separator" data-orientation="horizontal" style="height:1px;width:100%"></div><div data-slot="separator" data-orientation="vertical" style="height:24px;width:1px"></div></section>
<section class="panel"><h3>嵌入式 actions / tabs</h3><div class="pill-shell"><div class="pill bg-popover text-popover-foreground pointer-events-auto" id="selection-pill"><span class="text-muted-foreground px-1.5 font-medium whitespace-nowrap tabular-nums">3 selected</span><button data-slot="button" data-variant="ghost">Select all</button><button data-slot="button" data-variant="ghost">Clear</button></div></div><div class="pill-shell"><div class="pill bg-popover text-popover-foreground pointer-events-auto" id="search-pagination-pill"><button data-slot="button" data-variant="ghost">Prev</button><span class="text-muted-foreground px-2 font-medium whitespace-nowrap tabular-nums">2 / 5</span><button data-slot="button" data-variant="ghost">Next</button></div></div><button data-slot="button" data-variant="secondary" class="bg-popover/95 absolute rounded-full border backdrop-blur">↑ New items</button><div id="embedded-tabs"><div data-slot="tabs-list" class="tabs-list"><span data-slot="tab-indicator" class="tab-indicator"></span><button data-slot="tabs-tab" data-active="true">One</button><button data-slot="tabs-tab">Two</button></div></div></section>
<section class="vrcx-0-page-scaffold" id="excluded"><h3>排除的 PageScaffold tabs</h3><div data-slot="tabs-list" class="tabs-list"><button data-slot="tabs-tab" data-active="true">Page</button></div></section>
<section class="panel"><h3>设置页 scaffold · 真实结构 PageScaffold &gt; Tabs[vertical] &gt; TabsList.w-44</h3><div class="vrcx-0-page-scaffold" id="settings"><div data-slot="tabs" data-orientation="vertical"><div data-slot="tabs-list" class="tabs-list w-44" data-orientation="vertical"><button data-slot="tabs-tab" data-active="true">Settings</button></div><div data-slot="tabs-content"><span data-slot="badge" data-variant="default" class="legacy">setting</span><button data-slot="button" data-variant="default" class="legacy">settings action</button></div></div></div></section>
</main>
<!-- Real structure (Base UI FloatingPortal + its own surface): the login surface is a separate shell and dialogs are portalled to body, so neither is a descendant of .vrcx-0-main-content. The generic rules are scoped to .vrcx-0-main-content / .vrcx-0-side-panel, so these controls are out of reach by construction rather than by a :not() blacklist. -->
<section class="panel" id="outside-main"><h3>作用域之外：登录 surface / 实体详情窗</h3><div data-vrcx-0-surface="login-page" id="login-surface"><button data-slot="button" data-variant="default" class="legacy">Login</button></div><div class="entity-dialog" id="entity-surface"><button data-slot="button" data-variant="default" class="legacy">Entity</button><span data-slot="badge" data-variant="default" class="legacy">entity</span></div></section>
</body></html>
