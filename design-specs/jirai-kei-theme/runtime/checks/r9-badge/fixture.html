<!doctype html>
<html class="dark">
<head>
  <meta charset="utf-8">
  <title>R9 notification badge fixture — NOT WINDOWS</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-width:960px;width:100%;height:100%;background:#16112a;color:#f2ebff;font-family:Arial,sans-serif}
    .fixture{width:100%;height:320px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #6c5ce0}
    .vrcx-0-titlebar{height:32px;min-height:32px;display:flex;align-items:center;gap:12px;padding:0 8px;position:relative}
    .vrcx-0-brand{font:700 12px/1 monospace}
    .title-actions{margin-left:auto;height:100%;display:flex;align-items:center;gap:4px}
    .window-controls{height:100%;display:flex;align-items:center}
    .vrcx-0-titlebar button{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;position:relative;border:1px solid #21132d;padding:0;background:#f8c6e3;color:#21132d}
    .vrcx-0-titlebar button svg{width:16px;height:16px;flex:none}
    .vrcx-0-titlebar button[data-size=icon]{width:28px;height:28px}
    .title-actions button#quick-search{width:224px;height:24px;justify-content:flex-start;padding:0 8px}
    .window-controls button#window-control{width:36px;height:100%}
    .absolute{position:absolute}.top-0\.5{top:2px}.right-1{right:4px}
    .body{flex:1;min-height:0;display:flex;overflow:hidden}
    .vrcx-0-sidebar-surface{width:190px;flex:none;display:flex;flex-direction:column;position:relative;background:#201936}
    .vrcx-0-sidebar-surface [data-sidebar=content]{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;padding:8px 6px 4px}
    .vrcx-0-sidebar-surface [data-sidebar=group]{padding:0}
    .vrcx-0-sidebar-surface [data-sidebar=menu]{display:flex;flex-direction:column;gap:2px;margin:0;padding:4px;list-style:none}
    .vrcx-0-sidebar-surface [data-sidebar=menu-button]{height:36px;min-height:36px;display:flex;align-items:center;padding:7px 8px;color:#f2ebff;background:transparent;text-decoration:none}
    .vrcx-0-side-panel{position:relative;flex:1;min-width:0;background:#261d3c}
    .vrcx-0-statusbar{height:25px;min-height:25px;position:relative;display:flex;align-items:center;background:#ffd9ee}
    .note{padding:12px;font:12px/1.5 monospace;color:#f2ebff}
    #aa-options{display:flex;gap:8px;margin-top:10px}
    #aa-options .aa-case{flex:1;min-width:0;height:32px;padding:0 8px;display:flex;align-items:center;gap:8px;background:#d97fc6;color:#21132d}
    #aa-options .aa-case-label{font:11px/1 monospace;white-space:nowrap}
    #aa-options .aa-probe{position:relative;flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid #21132d;background:#f8c6e3;color:#21132d}
    #aa-options .aa-probe svg{width:16px;height:16px;flex:none}
    #aa-options .aa-probe>[data-slot='badge']{animation:none!important}
    #aa-baseline-badge{opacity:1!important;will-change:auto!important}
    #aa-opacity-badge{opacity:.999!important;will-change:auto!important}
    #aa-will-change-badge{opacity:1!important;will-change:opacity!important}
    .fixture-label{position:absolute;right:10px;bottom:30px;color:#ffe4f2;font:700 11px monospace;pointer-events:none}
  </style>
</head>
<body>
  <div class="fixture">
    <header class="vrcx-0-titlebar" data-app-titlebar>
      <div class="vrcx-0-brand">VRCX · R9 badge fixture</div>
      <div class="title-actions">
        <button id="quick-search" type="button" aria-label="快速搜索" title="快速搜索">快速搜索　Ctrl K</button>
        <button id="notification-button" type="button" data-slot="button" data-variant="ghost" data-size="icon" aria-label="通知中心" class="relative size-7 min-w-7 rounded-md px-0">
          <svg class="lucide lucide-bell" data-icon="icon" style="rotate:-12deg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg>
          <span id="unread-badge" data-slot="badge" data-variant="default" class="absolute top-0.5 right-1 h-3 min-w-3 rounded-full px-0.5 py-0 text-[7px] leading-none">5</span>
        </button>
        <button id="next-action" type="button" aria-label="助手" title="助手"><svg class="lucide lucide-sparkles" data-icon="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z"></path><path d="M19 14v4m2-2h-4"></path></svg></button>
      </div>
      <div class="window-controls"><button id="window-control" type="button" aria-label="关闭" class="w-9 rounded-none border-0">×</button></div>
    </header>
    <div class="body">
      <aside class="vrcx-0-sidebar-surface"><div data-sidebar="content"><div data-sidebar="group"><ul data-sidebar="menu"><li><a data-sidebar="menu-button" data-active href="#"><span>主页</span></a></li></ul></div></div></aside>
      <main class="vrcx-0-side-panel"><div class="note"><span id="fixture-count">NOT WINDOWS · unread 5</span><br>仅为样式与动画验证，不代表真实未读数量。<div id="aa-options" aria-label="AA promotion comparison">
           <div class="aa-case vrcx-0-titlebar"><span class="aa-case-label">BASE</span><button id="aa-baseline-button" class="aa-probe" type="button"><svg class="lucide lucide-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg><span id="aa-baseline-badge" data-slot="badge" class="absolute top-0.5 right-1 h-3 min-w-3 rounded-full px-0.5 py-0 text-[7px] leading-none">99+</span></button></div>
           <div class="aa-case vrcx-0-titlebar"><span class="aa-case-label">OPACITY .999</span><button id="aa-opacity-button" class="aa-probe" type="button"><svg class="lucide lucide-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg><span id="aa-opacity-badge" data-slot="badge" class="absolute top-0.5 right-1 h-3 min-w-3 rounded-full px-0.5 py-0 text-[7px] leading-none">99+</span></button></div>
           <div class="aa-case vrcx-0-titlebar"><span class="aa-case-label">WILL-CHANGE</span><button id="aa-will-change-button" class="aa-probe" type="button"><svg class="lucide lucide-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg><span id="aa-will-change-badge" data-slot="badge" class="absolute top-0.5 right-1 h-3 min-w-3 rounded-full px-0.5 py-0 text-[7px] leading-none">99+</span></button></div>
         </div></div></main>
    </div>
    <footer class="vrcx-0-statusbar" data-vrcx-0-surface="statusbar"><span class="fixture-label">NOT WINDOWS</span><span style="padding-left:8px">本地样例</span></footer>
  </div>
</body>
</html>
