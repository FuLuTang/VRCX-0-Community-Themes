<!doctype html><html><head><meta charset="utf-8"><style>/* app-surface mocks live in @layer utilities: the real app is Tailwind v4, whose utilities are
   layered, so an UNLAYERED theme rule must win over them. Keeping these unlayered mis-modelled
   the cascade and made `:where()` theme rules lose to the fixture. */
@layer utilities{.legacy{border:1px solid #777;border-radius:6px;background:#333;color:#fff;padding:5px}.vrcx-0-page-toolbar input{height:32px}.addon{padding:4px}.multi>[data-slot=toggle]{height:28px;padding:4px 8px;border:1px solid transparent;border-radius:4px;background:transparent;color:#eee}.feed-group{display:flex;align-items:center;gap:4px;min-height:32px;padding:3px 8px;border:1px solid #777;border-radius:8px}.kbd{border:1px solid #666;border-radius:4px;padding:2px 5px}.otp{width:30px;height:34px;border:1px solid #666;border-radius:4px;display:inline-grid;place-items:center}.color{width:38px;height:32px}.file{max-width:384px}}
*{box-sizing:border-box}body{margin:0;padding:16px;background:#16112a;color:#f2ebff;font:13px system-ui}.vrcx-0-main-content{display:grid;grid-template-columns:1fr 1fr;gap:14px}.vrcx-0-page-scaffold,.panel{padding:12px;border:1px solid #6c5ce0;background:#201936}.vrcx-0-page-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}.row{display:flex;align-items:center;gap:8px;margin:8px 0}.field{display:flex;flex-direction:column;gap:4px}.multi{display:flex;gap:0}.chip{display:inline-flex;align-items:center;justify-content:center;height:21px;padding:2px 6px;border-radius:3px;background:#444;color:white}.remove{width:24px;height:24px;border:0;border-radius:50%;background:transparent;color:white}.feed-input{min-width:80px;flex:1;background:transparent;border:0;color:white}.tools-demo{margin-top:8px}.settings-demo{margin-top:8px}
</style></head><body><main class="vrcx-0-main-content">
<section class="vrcx-0-page-scaffold" id="general"><h3>全局页面工具栏</h3><div class="vrcx-0-page-toolbar"><div data-vrcx-0-control="toolbar" data-slot="input-group" id="global-toolbar"><span data-slot="input-group-addon" class="addon">⌕</span><input data-slot="input-group-control" aria-label="搜索样例" class="legacy" placeholder="搜索…"><button data-slot="input-group-button">×</button></div><div data-slot="toggle-group" data-variant="default" class="multi" id="filters"><button data-slot="toggle" aria-pressed="true">好友</button><button data-slot="toggle">位置</button></div><div data-slot="input-group" class="feed-group" id="feed-search"><div data-slot="combobox-chips" class="feed-group"><span data-slot="combobox-chip" class="chip">示例用户 <button data-slot="combobox-chip-remove" class="remove" aria-label="移除">×</button></span><input data-slot="combobox-chip-input" class="feed-input" placeholder="搜索用户"></div></div></div><div class="field"><label data-slot="field-label">名称</label><input id="field-input" data-slot="input" class="legacy" placeholder="输入名称"></div><div class="field"><label data-slot="label">备注</label><textarea id="textarea" data-slot="textarea" class="legacy" rows="2" placeholder="文本备注"></textarea></div><div class="row"><kbd data-slot="kbd" class="kbd">Ctrl</kbd><span data-slot="kbd-group"><kbd data-slot="kbd" class="kbd">K</kbd><kbd data-slot="kbd" class="kbd">↵</kbd></span><span data-slot="input-otp-slot" data-active="true" class="otp">7</span></div></section>
<section class="panel" id="native-fields"><h3>剩余原生字段</h3><div class="row"><input type="radio" name="r" checked><span>单选语义</span><input class="color" type="color" value="#ff88bb"><input class="file" type="file"></div><div class="row"><input type="time" value="09:30"></div></section>
<section class="vrcx-0-page-scaffold" id="chart"><h3>工具页回归（由 tools-ui-r9 拥有）</h3><div class="vrcx-0-page-toolbar"><div data-vrcx-0-control="toolbar" data-slot="input-group" id="tools-toolbar"><span data-slot="input-group-addon">⌕</span><input data-slot="input-group-control" aria-label="Tools 搜索" class="legacy" placeholder="Tools"></div></div><div class="relative mt-4"><div data-slot="tabs" data-orientation="vertical"><div data-slot="tabs-list" data-orientation="vertical"></div></div></div></section>
<section class="panel"><h3>排除回归</h3><div data-vrcx-0-surface="login-page"><input data-slot="input" class="legacy" placeholder="login"></div><div class="entity-dialog"><textarea data-slot="textarea" class="legacy"></textarea></div><div class="vrcx-0-page-scaffold" id="settings"><div data-slot="tabs" data-orientation="vertical"><div data-slot="tabs-list" class="w-44" data-orientation="vertical"></div><div data-slot="tabs-content"><input data-slot="input" class="legacy"></div></div></div></section>
</main></body></html>
