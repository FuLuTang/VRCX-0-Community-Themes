<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>P1-G1 input-group-button · B1 / B3 对照</title>
<style>
:root{color-scheme:dark;--ink:#f2ebff;--muted:#b9add9;--pink:#ffb8e6;--pink-hover:#f37fc4;--edge:#6c5ce0;--deep:#16112a;--bevel-hi:#fdf4ff;--bevel-low:#7a3f6d;--shadow:inset 1px 1px var(--bevel-hi),inset -1px -1px var(--bevel-low)}
*{box-sizing:border-box}body{margin:0;padding:32px;background:#171326;color:var(--ink);font:14px/1.5 "Segoe UI",sans-serif}h1{margin:0 0 8px;font-size:24px}p{color:#c9bddf;margin:0 0 24px}.compare{display:grid;grid-template-columns:repeat(2,minmax(320px,1fr));gap:18px}.panel{padding:20px;background:#211a33;border:1px solid #51416f;box-shadow:4px 4px 0 #100b1e}.panel h2{margin:0 0 18px;font-size:18px;color:#ffb8e6}.cases{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px}.case{min-width:0}.case h3{font-size:13px;color:#d6b8ef;margin:0 0 8px}.field{height:38px;display:flex;align-items:stretch;min-width:0;overflow:visible}.field.b1{background:#201936;border:1px solid #6c5ce0;border-radius:0;box-shadow:inset 1px 1px #16112a,inset -1px -1px #a294c8}.field.b3{background:#2a2147;border:2px solid;border-color:#69557c #fdf4ff #fdf4ff #69557c;border-radius:0;box-shadow:inset 2px 2px #16112a,inset -2px -2px #a294c8}.control{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);padding:0 10px;font:inherit}.control::placeholder{color:var(--muted)}.addon{display:flex;align-items:center;padding:0 9px;color:#d6b8ef;white-space:nowrap}.slotbtn{flex:0 0 auto;align-self:stretch;min-width:38px;padding:0 10px;border:0;border-radius:0;background:var(--pink);color:var(--deep);box-shadow:var(--shadow);font:600 13px/1.2 "Segoe UI",sans-serif;cursor:pointer}.slotbtn.icon{width:38px;padding:0;font-size:18px}.slotbtn.danger{background:#ff6b8a}.slotbtn:hover{background:var(--pink-hover)}.slotbtn:active{transform:translate(1px,1px);box-shadow:inset 2px 2px #16112a,inset -1px -1px #fdf4ff}.slotbtn:focus-visible{outline:2px solid #ff7fcf;outline-offset:1px}.field:focus-within{outline:2px solid #ff7fcf;outline-offset:1px;z-index:1}.duo{display:flex}.duo .slotbtn:first-child{border-right:1px solid rgb(22 17 42/.3)}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;color:#c9bddf;font-size:12px}.swatch{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-2px;border:1px solid #69557c}.swatch.b1{background:#201936}.swatch.b3{background:#2a2147;border-width:2px;border-color:#69557c #fdf4ff #fdf4ff #69557c}@media(max-width:760px){.compare{grid-template-columns:1fr}.cases{grid-template-columns:1fr 1fr}}@media(max-width:420px){body{padding:16px}.cases{grid-template-columns:1fr}}
</style></head>
<body>
<h1>Input group button：B1 / B3</h1>
<p>四种按钮组合使用同一套组内按钮外观；左侧 B1 凹陷外框，右侧 B3 四边斜面外框。此图为样式结构示意，不表示 inventory 已采集所有场景。</p>
<main class="compare">
<section class="panel"><h2>B1 · 当前凹陷外框</h2><div class="cases">
<div class="case"><h3>前置图标按钮</h3><div class="field b1"><button class="slotbtn icon" aria-label="搜索">⌕</button><input class="control" placeholder="搜索…"></div></div>
<div class="case"><h3>尾部清除按钮</h3><div class="field b1"><input class="control" value="关键词"><button class="slotbtn danger icon" aria-label="清除">×</button></div></div>
<div class="case"><h3>尾部提交按钮</h3><div class="field b1"><input class="control" placeholder="输入名称"><button class="slotbtn">提交</button></div></div>
<div class="case"><h3>组内两段按钮</h3><div class="field b1"><input class="control" placeholder="选择范围"><div class="duo"><button class="slotbtn">今天</button><button class="slotbtn">本周</button></div></div></div>
</div><div class="legend"><span><i class="swatch b1"></i>1px 紫色描边 + 凹陷阴影</span></div></section>
<section class="panel"><h2>B3 · 四边斜面外框</h2><div class="cases">
<div class="case"><h3>前置图标按钮</h3><div class="field b3"><button class="slotbtn icon" aria-label="搜索">⌕</button><input class="control" placeholder="搜索…"></div></div>
<div class="case"><h3>尾部清除按钮</h3><div class="field b3"><input class="control" value="关键词"><button class="slotbtn danger icon" aria-label="清除">×</button></div></div>
<div class="case"><h3>尾部提交按钮</h3><div class="field b3"><input class="control" placeholder="输入名称"><button class="slotbtn">提交</button></div></div>
<div class="case"><h3>组内两段按钮</h3><div class="field b3"><input class="control" placeholder="选择范围"><div class="duo"><button class="slotbtn">今天</button><button class="slotbtn">本周</button></div></div></div>
</div><div class="legend"><span><i class="swatch b3"></i>2px 四边高光/阴影斜面</span></div></section>
</main></body></html>
