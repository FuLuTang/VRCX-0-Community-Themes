<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P1-G3 select-content 浮层预览</title>
<style>
:root{color-scheme:dark;--surface:#211a33;--ink:#f2ebff;--edge:#6c5ce0;--pink:#ffb8e6;--dark:#16112a;--muted:#b9add9;--pixel:#2a2147;font:16px/1.45 "Geist Variable",Geist,"Noto Sans SC",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,#302344 0,#171224 58%,#100b1e 100%);color:var(--ink)}
.stage{width:min(760px,94vw);padding:38px 24px}.eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:#b9add9}.stage h1{font-size:22px;margin:7px 0 6px}.stage p{font-size:13px;color:#b9add9;margin:0 0 30px}.demo{display:flex;align-items:flex-start;gap:36px;flex-wrap:wrap}.anchor{margin-top:18px;padding:10px 14px;border:1px solid #8c71b0;background:#201936;color:var(--ink);box-shadow:inset 1px 1px #69557c,inset -1px -1px #100b1e}.anchor::after{content:"⌄";margin-left:24px;color:var(--pink)}
[data-slot="select-content"]{width:280px;max-height:310px;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--edge);border-radius:0;box-shadow:inset 1px 1px 0 #69557c,inset -1px -1px 0 #7a3f6d,3px 3px 0 #100b1e;padding:6px;scrollbar-width:auto;scrollbar-color:#ff7fcf var(--pixel)}
[data-slot="select-label"]{display:block;color:#ffd9ee;background:linear-gradient(var(--pink),var(--pink)) 7px center/7px 7px no-repeat #302344;padding:8px 8px 8px 22px;border-bottom:1px solid var(--edge);font-weight:600;font-size:13px}
[data-slot="select-item"]{display:flex;align-items:center;min-height:34px;padding:6px 10px;color:var(--ink);background:transparent;white-space:nowrap}
[data-slot="select-item"][data-highlighted="true"]{background:var(--pink);color:var(--dark);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);box-shadow:inset 0 1px 0 #ffd9ee,inset 0 -1px 0 #d97fc6}
.check{margin-left:auto;font-weight:700}.group{padding-top:5px}.separator{height:1px;margin:5px 3px;background:repeating-linear-gradient(90deg,#8c71b0 0 1px,transparent 1px 3px)}
[data-slot="select-content"]::-webkit-scrollbar{width:14px;background:var(--pixel)}[data-slot="select-content"]::-webkit-scrollbar-track{background:var(--pixel);box-shadow:inset 0 0 0 1px var(--edge)}[data-slot="select-content"]::-webkit-scrollbar-thumb{background:#ff7fcf;border:1px solid var(--dark);box-shadow:inset 1px 1px #fdf4ff,inset -1px -1px #7a3f6d}
.caption{font-size:12px;color:var(--muted);max-width:260px;line-height:1.7}.caption b{color:#ffd9ee}
</style>
</head>
<body>
<main class="stage">
  <div class="eyebrow">JIRAI KEI · COMPONENT AUDIT · G3</div>
  <h1>Select / Combobox 浮层</h1>
  <p>静态组件皮肤示意 · data-slot="select-content" · portal-safe selector</p>
  <div class="demo">
    <div class="anchor">选择收藏分类</div>
    <section data-slot="select-content" role="listbox" aria-label="收藏分类">
      <div data-slot="select-label">收藏分类</div>
      <div class="group">
        <div data-slot="select-item" role="option" aria-selected="false">所有收藏 <span class="check"></span></div>
        <div data-slot="select-item" role="option" aria-selected="false">公开世界 <span class="check"></span></div>
        <div data-slot="select-item" role="option" aria-selected="true" data-highlighted="true">私人世界 <span class="check">✓</span></div>
        <div class="separator" data-slot="select-separator"></div>
        <div data-slot="select-label">其他</div>
        <div data-slot="select-item" role="option" aria-selected="false">最近访问 <span class="check"></span></div>
        <div data-slot="select-item" role="option" aria-selected="false">已归档 <span class="check"></span></div>
      </div>
    </section>
    <aside class="caption"><b>状态图例</b><br>粉底斜切条：选中 / 键盘或指针高亮示意<br>紫色细纹：组间分隔；右侧滚动轨道为主题像素滚动条。</aside>
  </div>
</main>
</body>
</html>
