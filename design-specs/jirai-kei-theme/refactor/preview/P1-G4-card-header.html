<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P1-G4 card-header 视觉对照</title>
<style>
:root{color-scheme:dark;--desktop:#16112a;--window:#201936;--title:#2f2552;--frame:#6c5ce0;--text:#f2ebff;--muted:#b9add9;--pink:#d97fc6}
*{box-sizing:border-box}body{margin:0;padding:32px;background:var(--desktop);color:var(--text);font:14px/1.55 system-ui,sans-serif}
h1{font-size:22px;margin:0 0 6px} .lead{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;align-items:start}
figure{margin:0}.card{background:var(--window);border:1px solid var(--frame);min-height:205px;box-shadow:0 0 0 1px #3d305e,4px 4px 0 #100b1e}
.header{padding:12px 14px;font-weight:600}.body{padding:15px 14px 20px;color:#e4d9f7;min-height:140px}
.default .header{background-color:transparent;border-bottom:.8px dotted #70518f;box-shadow:none}
.raised .header{background-color:#2f2552;border-bottom:1px solid #16112a;box-shadow:inset 0 1px #fdf4ff}
.login .header{margin:-16px -16px 0;padding:16px 32px 8px;clip-path:polygon(2px 0,calc(100% - 2px) 0,100% 2px,100% 100%,0 100%,0 2px);border:0;border-bottom:1px solid #6c5ce0;border-radius:2px 2px 0 0;background:#d97fc6;color:#21132d;font-weight:700}
.login{padding:16px}.login .body{padding:15px 0 4px}.body p{margin:0 0 9px}.body .muted{color:#b9add9;font-size:12px}
figcaption{margin-top:10px;color:#f2ebff;font-weight:650}figcaption small{display:block;color:#b9add9;font-weight:400;margin-top:3px}
.note{margin-top:26px;padding:12px 14px;border:1px solid #6c5ce0;color:#b9add9;background:#201936}
</style>
</head>
<body>
<h1>G4 · card-header</h1><p class="lead">并排对照 header 与内容区的分隔关系。示意结构仅展示 paint / 分隔，不代表 inventory 中的实例尺寸。</p>
<main class="grid">
<figure><section class="card default"><header class="header">默认内容标题</header><div class="body"><p>内容区沿用卡片主背景。</p><p class="muted">透明标题带 · dotted 底线</p></div></section><figcaption>默认 / 内容头<small>背景透明；0.8px dotted #70518f；无阴影</small></figcaption></figure>
<figure><section class="card raised"><header class="header">设置 / 工具分组</header><div class="body"><p>卡片内容从标题栏底边之后开始。</p><p class="muted">title-band 的暗色实线明确分区。</p></div></section><figcaption>Raised title-band<small>#2f2552；1px solid #16112a；inset 0 1px #fdf4ff</small></figcaption></figure>
<figure><section class="card login"><header class="header">登录 · 账户</header><div class="body"><p>登录表单内容</p><p class="muted">负 margin / 补偿内距是布局契约，不宜并入通用 header。</p></div></section><figcaption>Login 容器特例<small>#d97fc6；底边 #6c5ce0；几何与默认头不同</small></figcaption></figure>
</main>
<aside class="note">Inventory 实测覆盖 3 个 fingerprint paint（37 + 25 + 1 次）；Login 视觉为 CSS 专项规则，未出现在该 inventory 的 route 列表中。内边距未采集。</aside>
</body>
</html>
