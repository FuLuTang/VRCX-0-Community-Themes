<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P1-G3 dropdown-menu-item · Jirai Kei</title>
<style>
:root{color-scheme:dark;--ink:#f2ebff;--muted:#b9add9;--pink:#ffb8e6;--deep:#16112a;--panel:#211a33;--line:#6c5ce0;--edge-light:#69557c;--edge-dark:#7a3f6d;--black:#100b1e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,#302344 0,#171124 46%,#100b1e 100%);font:14px/1.45 "WD Pixel CJK","Geist Variable",Geist,"Noto Sans SC",system-ui,sans-serif;color:var(--ink)}
main{width:min(460px,calc(100vw - 32px));padding:20px}.caption{margin:0 0 12px;color:#b9add9;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.menu{padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:0;box-shadow:inset 1px 1px 0 var(--edge-light),inset -1px -1px 0 var(--edge-dark),3px 3px 0 var(--black)}
.item{position:relative;min-height:38px;padding:8px 12px;display:flex;align-items:center;gap:11px;color:var(--ink);background:transparent;border-radius:0;cursor:default;user-select:none;transition:none}.item:hover,.item:focus-visible,.item[data-highlighted]{background:var(--pink);color:var(--deep);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);box-shadow:inset 0 1px 0 #ffd9ee,inset 0 -1px 0 #d97fc6;outline:0}.item:focus-visible{filter:brightness(1.04)}.icon{width:16px;height:16px;display:grid;place-items:center;flex:0 0 16px;color:currentColor;font-size:15px}.label{flex:1}.key{color:#b9add9;font:11px ui-monospace,monospace}.item:is(:hover,:focus-visible,[data-highlighted]) .key{color:#2a1d6e}.check{width:16px;flex:0 0 16px;text-align:center;color:#ffb8e6}.arrow{margin-left:auto;color:#d6b8ef}.disabled{color:var(--muted);opacity:1;cursor:not-allowed}.disabled:hover{background:transparent;color:var(--muted);clip-path:none;box-shadow:none}.destructive{color:#ff7fae}.destructive:hover{color:var(--deep)}.separator{height:1px;margin:6px 3px;background:repeating-linear-gradient(90deg,#8c71b0 0 1px,transparent 1px 3px)}.note{margin:14px 0 0;color:#b9add9;font-size:12px}.tag{color:#ffd9ee}.item[aria-label="Keyboard highlighted example"]{background:var(--pink);color:var(--deep);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);box-shadow:inset 0 1px 0 #ffd9ee,inset 0 -1px 0 #d97fc6}
</style>
</head>
<body><main>
<p class="caption">Jirai Kei · dropdown menu item states</p>
<section class="menu" role="menu" aria-label="示例下拉菜单">
  <div class="item" role="menuitem"><span class="label">普通菜单项</span><span class="key">⌘ N</span></div>
  <div class="item" role="menuitem"><span class="icon" aria-hidden="true">✦</span><span class="label">带图标的菜单项</span><span class="key">⌘ I</span></div>
  <div class="item" role="menuitemcheckbox" aria-checked="true"><span class="check" aria-hidden="true">✓</span><span class="label">显示状态栏</span></div>
  <div class="item" role="menuitem"><span class="label">更多选项</span><span class="arrow" aria-hidden="true">›</span></div>
  <div class="item" role="menuitem" data-highlighted aria-label="Keyboard highlighted example"><span class="label">键盘导航高亮示例</span><span class="key">↑ ↓</span></div>
  <div class="item disabled" role="menuitem" aria-disabled="true"><span class="label">不可用操作</span></div>
  <div class="separator" role="separator"></div>
  <div class="item destructive" role="menuitem"><span class="icon" aria-hidden="true">⌫</span><span class="label">移除项目</span></div>
</section>
<p class="note"><span class="tag">状态说明：</span>粉色切角条为 hover / data-highlighted 共用态；禁用项不响应高亮，危险操作保留粉红警示色。</p>
</main></body></html>
